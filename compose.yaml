services:
  frontend:
    build: .
    container_name: frontend
    ports:
      - "3002:3000"
    depends_on:
      - database
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

  database:
    image: postgres:17
    container_name: flashcards-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=flashcards
    ports:
      - "5432:5432"
    volumes:
      - flashcards_pgdata:/var/lib/postgresql/data

volumes:
  flashcards_pgdata:
